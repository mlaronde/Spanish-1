function freshState(){return{version:1,lessons:{},currentLesson:'u1-0',mastery:{vocab:{},verbs:{},grammar:{},skills:{vocabulary:{attempts:0,correct:0},grammar:{attempts:0,correct:0},verbs:{attempts:0,correct:0},reading:{attempts:0,correct:0},writing:{attempts:0,correct:0}}},games:{},quizHistory:[],assessmentHistory:[],mistakes:[],activity:[],studyDates:[],totalActivities:0,bestScores:{}}}

function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY)||'null');return x&&x.version?Object.assign(freshState(),x):freshState()}catch(e){return freshState()}}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Saved locally · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function recordActivity(type,label,score=null){const d=new Date().toISOString();state.activity.unshift({date:d,type,label,score});state.activity=state.activity.slice(0,60);state.totalActivities++;const day=d.slice(0,10);if(!state.studyDates.includes(day))state.studyDates.push(day);saveState()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s||'').normalize('NFC').toLowerCase().trim().replace(/[¿?¡!.,;:]+$/g,'').replace(/\s+/g,' ')}
function noAccent(s){return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function checkText(input,answers){answers=[...answers];const n=norm(input);if(answers.some(a=>norm(a)===n))return{ok:true,accent:true};if(answers.some(a=>noAccent(a)===noAccent(input)))return{ok:true,accent:false};return{ok:false,accent:false}}
function pct(a,b){return b?Math.round(a/b*100):0}
function level(p){return p>=90?'Mastered':p>=80?'Proficient':p>=65?'Developing':p>0?'Learning':'Not Started'}
function skillPct(k){const s=state.mastery.skills[k]||{attempts:0,correct:0};return pct(s.correct,s.attempts)}
function addSkill(cat,ok){cat=cat==='vocabulary'?'vocabulary':cat==='verbs'?'verbs':cat==='reading'?'reading':cat==='writing'?'writing':'grammar';const s=state.mastery.skills[cat];s.attempts++;if(ok)s.correct++;}
function streak(){let days=new Set(state.studyDates);let d=new Date();let count=0;for(;;){const k=d.toISOString().slice(0,10);if(days.has(k)){count++;d.setDate(d.getDate()-1)}else{if(count===0){d.setDate(d.getDate()-1);const y=d.toISOString().slice(0,10);if(days.has(y)){count++;d.setDate(d.getDate()-1);continue}}break}}return count}
function completedCount(){return Object.values(state.lessons).filter(x=>x.completed).length}
function allLessons(){return DATA.units.flatMap(u=>u.lessons.map((l,i)=>({u,l,i,key:u.id+'-'+i})))}
function overallProgress(){return pct(completedCount(),allLessons().length)}
function lessonStatus(key){return state.lessons[key]?.completed?'Completed':state.lessons[key]?.started?'In Progress':'Not Started'}
function nextLesson(){const ls=allLessons();const cur=ls.find(x=>x.key===state.currentLesson);const un=ls.find(x=>!state.lessons[x.key]?.completed);return un||cur||ls[0]}

<div class="card" style="margin-top:16px"><h3>Recent Activity</h3>${state.activity.length?state.activity.slice(0,6).map(a=>`<div class="lesson-row"><div><b>${esc(a.label)}</b><div class="muted small">${new Date(a.date).toLocaleString()}</div></div><div>${a.score!=null?a.score+'%':esc(a.type)}</div></div>`).join(''):'<div class="muted">Your activity will appear here.</div>'}</div>`}

function openLesson(uid,li){const u=DATA.units.find(x=>x.id===uid),l=u.lessons[li],key=uid+'-'+li;state.currentLesson=key;state.lessons[key]=Object.assign({started:true,completed:false,checkBest:0},state.lessons[key]);saveState();renderLesson(uid,li,0);show('lesson',l[0],u.title)}
function renderLesson(uid,li,tab=0){const u=DATA.units.find(x=>x.id===uid),l=u.lessons[li];const tabs=['Learn','Practice','Play','Check'];let body='';if(tab===0){const words=u.vocab.filter(v=>l[2].includes(v[0]));body=`<div class="card"><h3>Learning Target</h3><p>By the end of this lesson you should be able to ${esc(l[1].replace(/^./,m=>m.toLowerCase()))}</p></div><div class="card section"><div class="actions" style="justify-content:space-between"><h3>Vocabulary</h3><button class="btn" onclick="this.closest('.card').classList.toggle('hide-translation')">Hide / Show translations</button></div><div style="overflow:auto"><table class="vocab-table"><thead><tr><th>Spanish</th><th>English</th><th>Example</th></tr></thead><tbody>${words.map(v=>`<tr><td><b>${esc(v[0])}</b></td><td class="translation">${esc(v[1])}</td><td>${esc(v[3])}</td></tr>`).join('')}</tbody></table></div></div><div class="card section"><h3>Grammar & Forms</h3>${l[3].map(g=>`<div class="qbox"><b>${esc(g)}</b><p>${grammarExplanation(g,u)}</p></div>`).join('')}${l[4].map(v=>verbTable(u,v)).join('')}</div><div class="card warn"><h4>Common Mistakes</h4><p>${commonMistake(uid,li)}</p></div><div class="card section"><h3>Culture Focus</h3><p><b>${esc(u.culture)}</b></p><p class="muted">Connect this language unit to the assigned cultural theme. This study guide does not invent cultural facts beyond the supplied course sources.</p></div><div class="card section"><span class="tag">Optional Honors Challenge</span><h3>Think beyond translation</h3><p>${honorsChallenge(uid,li)}</p><details><summary>How to approach it</summary><p class="muted">Explain your choice using a rule from this lesson, then write or revise one complete Spanish sentence. Open-ended work is for self-comparison unless a specific answer key is shown.</p></details></div>`}
if(tab===1){body=`<div class="card"><h3>Guided Practice</h3><p>Work through these questions with immediate explanatory feedback.</p><div id="lessonPractice"></div></div>`}

const prev=allLessons().findIndex(x=>x.key===uid+'-'+li)-1,next=allLessons().findIndex(x=>x.key===uid+'-'+li)+1;document.getElementById('lesson').innerHTML=`<div class="lesson-shell"><div class="lesson-nav">${tabs.map((t,i)=>`<button class="btn ${tab===i?'primary':''}" onclick="renderLesson('${uid}',${li},${i})">${t}</button>`).join('')}</div>${body}<div class="actions section">${prev>=0?`<button class="btn" onclick="openLesson('${allLessons()[prev].u.id}',${allLessons()[prev].i})">← Previous Lesson</button>`:''}${next<allLessons().length?`<button class="btn" onclick="openLesson('${allLessons()[next].u.id}',${allLessons()[next].i})">Next Lesson →</button>`:''}</div></div>`;if(tab===1)renderQuestionSet(document.getElementById('lessonPractice'),shuffle(l[5]).slice(0,6),{instant:true,label:'Lesson practice'});if(tab===3)renderQuestionSet(document.getElementById('lessonCheck'),l[5],{instant:true,label:'Knowledge Check',onComplete:r=>{const key=uid+'-'+li;state.lessons[key].checkBest=Math.max(state.lessons[key].checkBest||0,r.percent);if(r.percent>=75)state.lessons[key].completed=true;recordActivity('knowledge-check',l[0]+' Knowledge Check',r.percent);renderLesson(uid,li,3)}})}
function grammarExplanation(g,u){const x=g.toLowerCase();if(x.includes('gender'))return 'Learn each noun together with its article. Agreement patterns help, but noun gender must ultimately be learned with the noun.';if(x.includes('subject pronoun'))return 'The pronoun tells who is doing the action and selects the verb form.';if(x.includes('present progressive'))return 'Conjugate estar for the subject, then add the present participle: -ando for -AR and -iendo for regular -ER/-IR.';if(x.includes('stem'))return 'The stem changes inside the verb “boot” forms; nosotros and vosotros keep the original stem in the present tense.';if(x.includes('direct object'))return 'A direct object receives the action. Use lo/la/los/las to replace a third-person direct-object noun.';if(x.includes('demonstr'))return 'Match proximity plus noun gender and number: este/esta/estos/estas; ese/esa/esos/esas; aquel/aquella/aquellos/aquellas.';return esc(u.grammar.find(z=>z.toLowerCase().includes(x.split(' ')[0]))||'Use the pattern in context, then confirm agreement and the subject/verb relationship.')}
function honorsChallenge(uid,li){const prompts={u1:['Explain why “las matemáticas” needs las, then create a new feminine-plural example.','Rewrite a greeting/introduction for a formal adult and explain which formality choice changes.','Find a noun/article pair in this lesson and explain its gender and number.'],u2:['Correct this idea if needed: “Las chicas es inteligente.” Explain every change.','Write two sentences about the same person: one with ser and one with estar, making the meaning difference clear.','Create a complete schedule sentence with a day and time, then add an ordinal number in a separate accurate phrase.'],u3:['Turn a statement into both a yes/no question and an information question.','Combine two ideas with a conjugated verb + infinitive, then make the sentence negative.','Find and correct an ending error in a regular present-tense verb, explaining the subject-ending match.'],u4:['Write two near-future plans with ir + a + infinitive and one stem-changing verb.','Explain why gusta or gustan changes according to what is pleasing, then create one of each.','Compare a nosotros form with a stem-changing “boot” form and explain why the stem differs.'],u5:['Replace a direct-object noun with lo/la/los/las and explain the choice.','Write two sentences that contrast ser with estar for the same person or place.','Describe two actions happening now using estar + gerund and check subject agreement.'],u6:['Explain why Spanish says tener hambre rather than using estar, then create another tener expression.','Write one sentence with an irregular yo form and another with a non-yo subject of the same verb.','Combine a pastime, a condition, and a reason into two connected present-tense sentences.'],u7:['Correct agreement in a clothing sentence containing a demonstrative and a color adjective.','Choose between este/ese/aquel for three imagined distances and make each noun agree.','Write a natural four-line price exchange with a preference and a purchase decision.'],u8:['Combine travel plans, location, and weather into three connected sentences without using a past tense.','Write a sentence with a direct-object pronoun that refers to a travel item and explain its gender/number.','Infer a travel decision from the reading and support it with two details from the passage.']};return esc((prompts[uid]||prompts.u1)[li%3])}
function commonMistake(uid,li){const m={u1:['Do not guess noun gender from meaning. Learn the article with the noun.','Spanish vowels are much more stable than English vowels; avoid adding English glide sounds.','When a noun becomes plural, the article must become plural too.'],u2:['Ser and estar do not simply mean “permanent” versus “temporary.” Focus on identity/inherent characteristic versus state/location.','Age uses tener: Tengo quince años, not *soy quince años.','Adjectives that change for gender/number must agree with the noun.'],u3:['Do not leave the infinitive after a subject when a conjugated present verb is required.','Question words such as qué, cómo, cuándo, dónde and por qué carry accents in questions.','No normally goes directly before the conjugated verb.'],u4:['Ir + a + infinitive needs the a: voy a estudiar.','Gustar agrees with what is pleasing: gusta + singular/infinitive; gustan + plural noun.','Stem changes do not occur in nosotros/vosotros present forms.'],u5:['Direct-object pronouns must match the noun they replace.','Present progressive requires a conjugated form of estar.','Professions normally follow ser without un/una unless modified.'],u6:['Use tener hambre/sed/sueño/frío/calor, not estar.','Emotion adjectives with estar still agree with the person described.','Irregular yo forms must be learned exactly, including accents where relevant in other forms.'],u7:['Demonstratives must match the noun in both gender and number.','Costar changes o→ue in boot forms: cuesta/cuestan.','Color adjectives such as rojo/negro vary to agree with the noun.'],u8:['This course plan uses present and near future for travel; do not introduce preterite forms here.','Location uses estar: el hotel está cerca del mar.','Keep previously learned agreement and pronoun rules active in longer writing.']};return m[uid]?.[li]||m[uid]?.[0]||''}
function verbTable(u,inf){const v=u.verbs.find(x=>x.inf===inf);if(!v)return'';return `<div class="qbox"><h4>${esc(v.inf.toUpperCase())} — ${esc(v.en)}</h4><table class="verb-table"><tbody>${pronouns.map((p,i)=>`<tr><td>${esc(p)}</td><td><b>${esc(v.forms[i])}</b></td></tr>`).join('')}</tbody></table></div>`}

function renderQuestionSet(el,qs,opt={}){let idx=0,correct=0,answered=0,results=[];const label=opt.label||'Practice';function draw(){if(idx>=qs.length){const percent=pct(correct,qs.length);el.innerHTML=`<div class="success card"><h3>Complete</h3><div class="metric">${percent}%</div><p>${correct} of ${qs.length} correct.</p></div>`;opt.onComplete?.({correct,total:qs.length,percent,results});return}const q=qs[idx];let input='';if(q.type==='mc'){const choices=shuffle(q.choices);input=`<div class="choices">${choices.map(c=>`<button class="choice" data-val="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}else if(q.type==='fill'){input=`<div class="actions" style="margin-top:12px"><input id="qinput" aria-label="Answer" autocomplete="off" style="min-height:48px;flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:9px"><button class="btn primary" id="submitText">Check</button></div>`}else if(q.type==='order'){const words=shuffle(String(q.answer).split(' '));input=`<p class="small muted">Tap words to build the sentence. Tap a placed word to return it.</p><div class="chips" id="srcChips">${words.map((w,i)=>`<button class="chip" data-word="${esc(w)}">${esc(w)}</button>`).join('')}</div><div class="answer-zone" id="ansZone"></div><button class="btn primary" id="orderCheck">Check sentence</button>`}el.innerHTML=`<div class="qbox"><div class="small muted">${label} · ${idx+1} / ${qs.length} · ${esc(q.topic)}</div><h3>${esc(q.prompt)}</h3>${input}<div id="fb"></div></div>`;if(q.type==='mc')el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>grade(b.dataset.val,b));if(q.type==='fill'){el.querySelector('#submitText').onclick=()=>grade(el.querySelector('#qinput').value);el.querySelector('#qinput').onkeydown=e=>{if(e.key==='Enter')grade(e.target.value)}}if(q.type==='order'){wireChipZones(el);el.querySelector('#orderCheck').onclick=()=>grade([...el.querySelectorAll('#ansZone .chip')].map(x=>x.dataset.word).join(' '))}}
function grade(val,btn){if(el.dataset.locked==='1')return;const q=qs[idx];let ok=false,accent=true;if(q.type==='mc'||q.type==='order')ok=norm(val)===norm(q.answer);else{const c=checkText(val,[q.answer,...(q.alts||[])]);ok=c.ok;accent=c.accent}answered++;if(ok)correct++;addSkill(q.cat,ok);if(!ok)addMistake(q,val);else resolveMistake(q);results.push({q,ok,val});const fb=el.querySelector('#fb');fb.innerHTML=`<div class="feedback ${ok?'success':'warn'}"><b>${ok?'Correct.':'Not quite.'}</b> ${ok&&!accent?`Correct word/form, but remember the accent: <b>${esc(q.answer)}</b>. `:''}${!ok?`Correct answer: <b>${esc(q.answer)}</b>. `:''}${esc(q.explanation)}<div style="margin-top:10px"><button class="btn primary" id="nextQ">${idx===qs.length-1?'Finish':'Next'}</button></div></div>`;if(btn){el.querySelectorAll('.choice').forEach(x=>{if(norm(x.dataset.val)===norm(q.answer))x.classList.add('correct')});if(!ok)btn.classList.add('wrong')}el.dataset.locked='1';saveState();el.querySelector('#nextQ').onclick=()=>{idx++;el.dataset.locked='0';draw()}}
draw()}
function addMistake(q,given){const key=norm(q.prompt)+'|'+norm(q.answer);let m=state.mistakes.find(x=>x.key===key);if(!m){state.mistakes.unshift({key,prompt:q.prompt,answer:q.answer,topic:q.topic,cat:q.cat,unit:q.unit,date:new Date().toISOString(),given:String(given||''),resolved:false,correctLater:0})}else{m.date=new Date().toISOString();m.given=String(given||'');m.resolved=false}state.mistakes=state.mistakes.slice(0,150)}
function resolveMistake(q){const key=norm(q.prompt)+'|'+norm(q.answer);const m=state.mistakes.find(x=>x.key===key);if(m){m.correctLater=(m.correctLater||0)+1;if(m.correctLater>=2)m.resolved=true}}
function wireChipZones(root){const src=root.querySelector('#srcChips'),ans=root.querySelector('#ansZone');if(!src||!ans)return;root.querySelectorAll('.chip').forEach((b,i)=>{if(!b.dataset.chipId)b.dataset.chipId='chip-'+i+'-'+Math.random().toString(36).slice(2,8);b.onclick=()=>{(b.parentElement===src?ans:src).appendChild(b)};b.draggable=true;b.ondragstart=e=>{e.dataTransfer.setData('text/plain',b.dataset.chipId);e.dataTransfer.effectAllowed='move'}});[src,ans].forEach(zone=>{zone.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};zone.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');const b=root.querySelector(`.chip[data-chip-id="${id}"]`);if(b&&b.parentElement!==zone)zone.appendChild(b)}})}

function renderStudy(){const unitOpts=DATA.units.map((u,i)=>`<option value="${u.id}">Unit ${i+1}: ${esc(u.title)}</option>`).join('');document.getElementById('study').innerHTML=`<div class="card"><h3>Study Mode</h3><p>Choose a unit, then study vocabulary, verbs, or grammar. Mastery requires repeated successful performance—not one answer.</p><label>Unit <select id="studyUnit" style="min-height:46px;padding:8px;border-radius:10px;border:1px solid var(--line)">${unitOpts}</select></label><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="startVocabStudy()">Vocabulary Flashcards</button><button class="btn" onclick="startVerbStudy()">Verb Study</button><button class="btn" onclick="startGrammarPractice()">Grammar Study</button></div></div><div id="studyArea" class="section"></div>`}
function selectedUnit(){const id=document.getElementById('studyUnit')?.value||state.currentLesson.split('-')[0]||'u1';return DATA.units.find(u=>u.id===id)||DATA.units[0]}

function drawFlash(){const a=document.getElementById('studyArea');if(!flashSession||!a)return;const f=flashSession;if(f.i>=f.cards.length){a.innerHTML=`<div class="card success"><h3>Vocabulary session complete</h3><p>You reviewed ${f.cards.length} cards.</p><button class="btn primary" onclick="startVocabStudy()">Study Again</button></div>`;recordActivity('study','Vocabulary Study · '+f.u.title);return}const v=f.cards[f.i];const k=f.u.id+'|'+v[0],m=state.mastery.vocab[k]||{score:0,seen:0};a.innerHTML=`<div class="card"><div class="small muted">${esc(f.u.title)} · Card ${f.i+1}/${f.cards.length} · Mastery ${Math.min(100,m.score*20)}%</div><div class="flashcard" tabindex="0" onclick="flashSession.reveal=!flashSession.reveal;drawFlash()"><div><div class="front">${esc(v[0])}</div>${f.reveal?`<div class="back"><b>${esc(v[1])}</b><br><span class="muted">${esc(v[3])}</span></div>`:`<div class="muted">Tap to reveal</div>`}</div></div>${f.reveal?`<div class="mastery-buttons"><button class="btn danger" onclick="rateVocab('${esc(k)}',-1)">Again</button><button class="btn" onclick="rateVocab('${esc(k)}',0)">Learning</button><button class="btn good" onclick="rateVocab('${esc(k)}',1)">Know It</button></div>`:''}</div>`}

function startVerbStudy(){if(!document.getElementById('study').classList.contains('active')){renderStudy();show('study','Study Mode');}const u=selectedUnit();const verbs=u.verbs;if(!verbs.length){document.getElementById('studyArea').innerHTML='<div class="card warn"><h3>No verb table in this unit yet</h3><p>This foundational unit focuses on greetings, pronunciation, nouns, and articles. Choose a later unit for conjugation study.</p></div>';return}let v=shuffle(verbs)[0],shown=false;document.getElementById('studyArea').innerHTML=`<div class="card"><h3>${esc(v.inf.toUpperCase())} — ${esc(v.en)}</h3><button class="btn" id="revealVerb">Reveal / Hide conjugation</button><div id="verbReveal" style="display:none">${verbTable(u,v.inf)}</div><div class="qbox"><h4>Random pronoun practice</h4><div id="verbPractice"></div></div></div>`;const rv=document.getElementById('verbReveal');document.getElementById('revealVerb').onclick=()=>rv.style.display=rv.style.display==='none'?'block':'none';const qs=[];for(let i=0;i<6;i++){const p=Math.floor(Math.random()*6);qs.push({type:'fill',prompt:`${pronouns[p]} + ${v.inf} =`,answer:v.forms[p],alts:[],topic:v.inf,cat:'verbs',explanation:`The ${pronouns[p]} form is ${v.forms[p]}.`,unit:u.id})}renderQuestionSet(document.getElementById('verbPractice'),qs,{instant:true,label:'Verb Knowledge Check',onComplete:r=>recordActivity('study','Verb Study · '+v.inf,r.percent)})}
function startGrammarPractice(){if(!document.getElementById('study').classList.contains('active')){renderStudy();show('study','Study Mode');}const u=selectedUnit();const qs=shuffle(DATA.banks[u.id].filter(q=>q.cat==='grammar'||q.cat==='verbs')).slice(0,8);document.getElementById('studyArea').innerHTML=`<div class="card"><h3>Grammar Study · ${esc(u.title)}</h3>${u.grammar.map(g=>`<div class="qbox"><b>${esc(g)}</b></div>`).join('')}<h3>Guided → Independent Practice</h3><div id="grammarQs"></div></div>`;renderQuestionSet(document.getElementById('grammarQs'),qs,{instant:true,label:'Grammar Knowledge Check',onComplete:r=>recordActivity('study','Grammar Study · '+u.title,r.percent)})}

function renderGames(){document.getElementById('games').innerHTML=`<div class="grid g2"><div class="card"><h3>Vocabulary Match</h3><p>Match Spanish ↔ English.</p><button class="btn primary" onclick="chooseGameUnit('match')">Play</button></div><div class="card"><h3>Verb Conjugation Challenge</h3><p>Conjugate from a subject + infinitive prompt.</p><button class="btn primary" onclick="chooseGameUnit('verb')">Play</button></div><div class="card"><h3>Sentence Builder</h3><p>Drag or tap words into a correct sentence.</p><button class="btn primary" onclick="startSentenceGame()">Play</button></div><div class="card"><h3>Grammar Sort</h3><p>Sort nouns/forms into course categories.</p><button class="btn primary" onclick="startGrammarSort()">Play</button></div><div class="card"><h3>Translation Challenge</h3><p>Build the Spanish translation from scrambled words. Extra words are included.</p><button class="btn primary" onclick="startTranslation()">Play</button></div><div class="card"><h3>Crossword Lab</h3><p>Generate a true intersecting vocabulary crossword from a selected unit with 15–30% prefilled letters.</p><button class="btn primary" onclick="startCrossword()">Build Crossword</button></div></div><div id="gameArea" class="section"></div>`}
function chooseGameUnit(type){const units=type==='verb'?DATA.units.filter(u=>u.verbs&&u.verbs.length):DATA.units;const opts=units.map((u)=>`<button class="btn" onclick="${type==='match'?'startMatch':'startVerbChallenge'}('${u.id}')">${esc(u.title)}</button>`).join('');document.getElementById('gameArea').innerHTML=`<div class="card"><h3>Choose a Unit</h3><div class="actions">${opts}</div>${type==='verb'?'<p class="small muted">Only units with taught conjugation tables are shown.</p>':''}</div>`}
function gameScore(key,score){state.games[key]=state.games[key]||{plays:0,best:0,last:0};state.games[key].plays++;state.games[key].last=score;state.games[key].best=Math.max(state.games[key].best,score);recordActivity('game',key,score)}
function gameArea(){const games=document.getElementById('games');if(games&&games.classList.contains('active'))return document.getElementById('gameArea');const lesson=document.getElementById('lesson');if(lesson&&lesson.classList.contains('active'))return document.getElementById('inlineGame');return document.getElementById('gameArea')||document.getElementById('inlineGame')}
function ensureGamesView(){if(!document.getElementById('games').classList.contains('active')){renderGames();show('games','Games')}}
function startMatch(uid='u1'){ensureGamesView();const u=DATA.units.find(x=>x.id===uid)||DATA.units[0],count=Math.min(6,u.vocab.length);window.__vmLastSets=window.__vmLastSets||{};let picked=shuffle(u.vocab).slice(0,count),sig=picked.map(v=>v[0]).sort().join('|');for(let n=0;n<10&&u.vocab.length>count&&sig===window.__vmLastSets[uid];n++){picked=shuffle(u.vocab).slice(0,count);sig=picked.map(v=>v[0]).sort().join('|')}window.__vmLastSets[uid]=sig;const items=picked.map((v,i)=>({id:i,es:v[0],en:v[1]}));const palette=['#dbeafe','#dcfce7','#fef3c7','#fce7f3','#ede9fe','#cffafe','#ffedd5','#e0e7ff'];let left=shuffle(items.map(x=>({id:x.id,t:x.es,side:'es'}))),right=shuffle(items.map(x=>({id:x.id,t:x.en,side:'en'}))),pairs=[],pending=null,nextColor=0,checks=0,completed=false;const area=gameArea();if(!area)return;function pairFor(side,idx){return pairs.find(p=>(p.a.side===side&&p.a.idx===idx)||(p.b.side===side&&p.b.idx===idx))}function cardStyle(side,idx){const p=pairFor(side,idx);if(p){if(p.status==='wrong')return 'background:#fff0f0;border-color:var(--bad);color:var(--ink)';const c=palette[p.color%palette.length];return `background:${c};border-color:${p.status==='correct'?'var(--ok)':'#7b8f99'};color:var(--ink)`}if(pending&&pending.side===side&&pending.idx===idx){const c=palette[nextColor%palette.length];return `background:${c};border-color:#526b78;color:var(--ink);box-shadow:0 0 0 2px #526b7822`}return ''}function draw(msg=''){const complete=pairs.length===items.length;area.innerHTML=`<div class="card game-board"><h3>Vocabulary Match · ${esc(u.title)}</h3><p class="muted">Select one Spanish word and its English match. Each pair receives its own color. When all words are paired, choose <b>Check Matches</b>.</p><div class="two-col"><div><h4>Spanish</h4><div class="grid" style="gap:8px">${left.map((c,i)=>`<button class="match-card" data-side="es" data-i="${i}" style="${cardStyle('es',i)}">${esc(c.t)}</button>`).join('')}</div></div><div><h4>English</h4><div class="grid" style="gap:8px">${right.map((c,i)=>`<button class="match-card" data-side="en" data-i="${i}" style="${cardStyle('en',i)}">${esc(c.t)}</button>`).join('')}</div></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="vmCheck" ${complete?'':'aria-disabled="true"'}>Check Matches</button><button class="btn" id="vmReset">New Words</button></div><div id="vmFb">${msg}</div></div>`;area.querySelectorAll('.match-card').forEach(b=>b.onclick=()=>pick(b.dataset.side,+b.dataset.i));area.querySelector('#vmCheck').onclick=check;area.querySelector('#vmReset').onclick=()=>startMatch(uid)}function unpair(p){pairs=pairs.filter(x=>x!==p);pending=null}function pick(side,idx){const existing=pairFor(side,idx);if(existing){if(existing.status==='correct')return;unpair(existing);draw('<div class="feedback">That pair has been cleared. Select the two cards you want to match.</div>');return}if(!pending){pending={side,idx};draw();return}if(pending.side===side){pending={side,idx};draw();return}pairs.push({a:pending,b:{side,idx},color:nextColor++,status:''});pending=null;draw()}function check(){if(pairs.length!==items.length){draw('<div class="feedback warn"><b>Finish pairing all words first.</b> Each Spanish card should have one English partner.</div>');return}checks++;let correct=0;for(const p of pairs){const ca=(p.a.side==='es'?left:right)[p.a.idx],cb=(p.b.side==='es'?left:right)[p.b.idx];p.status=ca.id===cb.id?'correct':'wrong';if(p.status==='correct')correct++}const all=correct===items.length;if(all){const score=100;if(!completed){completed=true;gameScore('Vocabulary Match · '+u.title,score);}draw(`<div class="feedback success"><b>All ${correct} pairs are correct!</b> Great work.</div>`)}else draw(`<div class="feedback warn"><b>${correct} of ${items.length} pairs are correct.</b> Incorrect pairs are red. Tap either red card to clear that pair, then match it again and recheck.</div>`) }draw()}
function startVerbChallenge(uid='u3'){ensureGamesView();const u=DATA.units.find(x=>x.id===uid)||DATA.units.find(x=>x.verbs&&x.verbs.length);if(!u||!u.verbs||!u.verbs.length){const a=gameArea();if(a)a.innerHTML='<div class="card warn">Choose a unit with verb tables.</div>';return}let qs=[];for(let i=0;i<10;i++){const v=u.verbs[Math.floor(Math.random()*u.verbs.length)],p=Math.floor(Math.random()*6);qs.push({type:'fill',prompt:`${pronouns[p]} + ${v.inf}`,answer:v.forms[p],alts:[],topic:v.inf,cat:'verbs',explanation:`${pronouns[p]} + ${v.inf} = ${v.forms[p]}.`,unit:u.id})}const area=gameArea();if(!area)return;area.innerHTML='<div class="card"><h3>Verb Conjugation Challenge</h3><div id="verbGameQs"></div></div>';renderQuestionSet(area.querySelector('#verbGameQs'),qs,{label:'Challenge',onComplete:r=>gameScore('Verb Challenge · '+u.title,r.percent)})}
function startSentenceGame(uid){ensureGamesView();let completed=false;const sets=DATA.sentenceBank.filter(x=>Array.isArray(x)&&x.length>1);const chosen=shuffle(sets)[0];if(!chosen)return;const target=chosen.join(' '),words=shuffle(chosen.map((w,i)=>({w,id:'sb-'+Date.now()+'-'+i})));const area=gameArea();if(!area)return;area.innerHTML=`<div class="card"><h3>Sentence Builder</h3><p class="muted">Drag or tap words into the answer area. Tap a placed word to move it back. After checking, words in the correct position turn green and words in the wrong position turn red.</p><div class="chips" id="srcChips">${words.map(x=>`<button class="chip" data-word="${esc(x.w)}" data-chip-id="${x.id}" draggable="true">${esc(x.w)}</button>`).join('')}</div><div class="answer-zone" id="ansZone" aria-label="Sentence answer area"></div><div class="actions"><button class="btn primary" id="sbCheck">Check</button><button class="btn" onclick="startSentenceGame('${uid||''}')">New Sentence</button></div><div id="sbFb"></div></div>`;wireChipZones(area);const clearMarks=()=>area.querySelectorAll('.chip').forEach(b=>{b.style.background='';b.style.borderColor='';b.removeAttribute('aria-label')});area.querySelectorAll('.chip').forEach(b=>{b.addEventListener('click',()=>setTimeout(clearMarks,0));b.addEventListener('dragend',()=>setTimeout(clearMarks,0))});area.querySelector('#sbCheck').onclick=()=>{clearMarks();const placed=[...area.querySelectorAll('#ansZone .chip')];let right=0;placed.forEach((b,i)=>{const good=i<chosen.length&&norm(b.dataset.word)===norm(chosen[i]);b.style.background=good?'#eef8f3':'#fff0f0';b.style.borderColor=good?'var(--ok)':'var(--bad)';b.setAttribute('aria-label',`${b.dataset.word}: ${good?'correct position':'incorrect position'}`);if(good)right++});const ok=placed.length===chosen.length&&right===chosen.length;area.querySelector('#sbFb').innerHTML=`<div class="feedback ${ok?'success':'warn'}"><b>${ok?'Correct!':`${right} of ${chosen.length} words are in the correct position.`}</b>${ok?' The sentence is complete and correctly ordered.':' Green words are already in the correct place. Red words need to be moved. You can rearrange the words and check again.'}</div>`;if(ok&&!completed){completed=true;gameScore('Sentence Builder',100)}}}
function startGrammarSort(){ensureGamesView();const items=shuffle([{w:'el libro',c:'Masculine'},{w:'la camisa',c:'Feminine'},{w:'el vuelo',c:'Masculine'},{w:'la playa',c:'Feminine'},{w:'los zapatos',c:'Masculine'},{w:'las matemáticas',c:'Feminine'},{w:'el arte',c:'Masculine'},{w:'la mochila',c:'Feminine'}]);let done=0,ok=0;const area=gameArea();if(!area)return;function draw(){if(done>=items.length){const sc=pct(ok,items.length);gameScore('Grammar Sort',sc);area.innerHTML=`<div class="card success"><h3>Grammar Sort Complete</h3><div class="metric">${sc}%</div><button class="btn primary" onclick="startGrammarSort()">Play Again</button></div>`;return}const x=items[done];area.innerHTML=`<div class="card"><h3>Grammar Sort</h3><p>Sort by grammatical gender.</p><div class="small muted">Item ${done+1}/${items.length}</div><div class="flashcard"><div class="front">${esc(x.w)}</div></div><div class="actions" style="justify-content:center;margin-top:15px"><button class="btn" data-c="Masculine">Masculine</button><button class="btn" data-c="Feminine">Feminine</button></div></div>`;area.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(b.dataset.c===x.c)ok++;done++;draw()})}draw()}
function startTranslation(){ensureGamesView();const items=shuffle(DATA.translations);let i=0,c=0,answered=false;const area=gameArea();if(!area)return;const distractorBank=['yo','tú','él','ella','nosotros','ellos','un','una','el','la','los','las','es','está','son','están','tengo','tiene','voy','va','no','muy','y','de','a','en','con','por','para','me','te','mi','mis','tu','tus'];function cleanTokens(s){return String(s).replace(/[¿?¡!.,;:]/g,'').split(/\s+/).filter(Boolean)}function draw(){answered=false;if(i>=items.length){const sc=pct(c,items.length);gameScore('Translation Challenge',sc);area.innerHTML=`<div class="card success"><h3>Translation Challenge Complete</h3><div class="metric">${sc}%</div><button class="btn primary" onclick="startTranslation()">Play Again</button></div>`;return}const [en,alts,model]=items[i],needed=cleanTokens(model),used=new Set(needed.map(norm)),extras=shuffle(distractorBank.filter(w=>!used.has(norm(w)))).slice(0,Math.min(4,Math.max(3,Math.ceil(needed.length/3)))),pool=shuffle([...needed,...extras]).map((w,n)=>({w,id:'tr-'+i+'-'+n+'-'+Math.random().toString(36).slice(2,6)}));area.innerHTML=`<div class="card"><div class="small muted">${i+1}/${items.length}</div><h3>Translate into Spanish:</h3><p style="font-size:1.15rem;font-weight:700">${esc(en)}</p><p class="muted">Use the correct Spanish words below. Some extra words do not belong in the sentence. Tap a word to move it into your answer; tap it again to return it.</p><div class="chips" id="srcChips">${pool.map(x=>`<button class="chip" data-word="${esc(x.w)}" data-chip-id="${x.id}" draggable="true">${esc(x.w)}</button>`).join('')}</div><div class="answer-zone" id="ansZone" aria-label="Spanish translation answer area"></div><div class="actions"><button class="btn primary" id="trCheck">Check Translation</button></div><div id="trFb"></div></div>`;wireChipZones(area);area.querySelector('#trCheck').onclick=()=>{const val=[...area.querySelectorAll('#ansZone .chip')].map(x=>x.dataset.word).join( function startCrossword(){ensureGamesView();const area=gameArea();if(!area)return;area.innerHTML=`<div class="card"><h3>Crossword Lab</h3><p class="small muted">Every added word must cross an existing word on the same letter. Words are not placed merely side-by-side.</p><label>Unit <select id="cwUnit" style="min-height:46px;padding:8px;border-radius:10px;border:1px solid var(--line)">${DATA.units.map((u,i)=>`<option value="${u.id}">Unit ${i+1}: ${esc(u.title)}</option>`).join('')}</select></label><button class="btn primary" style="margin-left:8px" id="cwBuild">Generate Puzzle</button><div id="cwArea" class="section"></div></div>`;area.querySelector('#cwBuild').onclick=()=>buildCrossword(area.querySelector('#cwUnit').value);buildCrossword('u1')}
function stripWord(s){let x=String(s||'').toUpperCase().replace(/Ñ/g,'~N~');x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/~N~/g,'Ñ');return x.replace(/[^A-ZÑ]/g,'')}
function crosswordLayout(entries,N=21,target=8){function key(r,c){return r+'-'+c}function makeAttempt(order){const grid=new Map(),placed=[];function cell(r,c){return grid.get(key(r,c))}function setCell(r,c,ch,dir){const k=key(r,c),v=grid.get(k)||{ch,dirs:new Set()};v.ch=ch;v.dirs.add(dir);grid.set(k,v)}function canPlace(e,r,c,dir,requireCross){let crosses=0;const dr=dir==='D'?1:0,dc=dir==='A'?1:0;const before=cell(r-dr,c-dc),after=cell(r+dr*e.word.length,c+dc*e.word.length);if(before||after)return null;for(let i=0;i<e.word.length;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<1||cc<1||rr>=N-1||cc>=N-1)return null;const here=cell(rr,cc);if(here){if(here.ch!==e.word[i]||here.dirs.has(dir))return null;crosses++}else{const n1=dir==='A'?cell(rr-1,cc):cell(rr,cc-1),n2=dir==='A'?cell(rr+1,cc):cell(rr,cc+1);if(n1||n2)return null}}if(requireCross&&crosses===0)return null;return crosses}function put(e,r,c,dir){const dr=dir==='D'?1:0,dc=dir==='A'?1:0;for(let i=0;i<e.word.length;i++)setCell(r+dr*i,c+dc*i,e.word[i],dir);placed.push({...e,r,c,dir,id:'cw-'+placed.length})}const first=order[0];if(!first)return null;put(first,Math.floor(N/2),Math.floor((N-first.word.length)/2),'A');for(const e of order.slice(1)){let candidates=[];for(const p of placed){for(let i=0;i<e.word.length;i++){for(let j=0;j<p.word.length;j++){if(e.word[i]!==p.word[j])continue;const dir=p.dir==='A'?'D':'A',r=p.r+(p.dir==='D'?j:0)-(dir==='D'?i:0),c=p.c+(p.dir==='A'?j:0)-(dir==='A'?i:0),cr=canPlace(e,r,c,dir,true);if(cr!=null){const compact=Math.abs(r-N/2)+Math.abs(c-N/2);candidates.push({r,c,dir,score:cr*100-compact+Math.random()})}}}}if(candidates.length){candidates.sort((a,b)=>b.score-a.score);const x=candidates[0];put(e,x.r,x.c,x.dir)}if(placed.length>=target)break}return{grid,placed}}let best=null;for(let attempt=0;attempt<80;attempt++){const order=shuffle(entries).sort((a,b)=>attempt%3===0?b.word.length-a.word.length:Math.random()-.5);const res=makeAttempt(order);if(!best||res.placed.length>best.placed.length)best=res;if(best.placed.length>=target)break}return best}
function validateCrosswordLayout(layout){const errors=[],p=layout.placed||[],grid=layout.grid;const coordMap=new Map();for(const e of p){for(let i=0;i<e.word.length;i++){const r=e.r+(e.dir==='D'?i:0),c=e.c+(e.dir==='A'?i:0),k=r+'-'+c;const arr=coordMap.get(k)||[];arr.push({e,i});coordMap.set(k,arr);const g=grid.get(k);if(!g||g.ch!==e.word[i])errors.push(`letter mismatch ${e.word}@${k}`)}}for(let x=1;x<p.length;x++){let intersects=0;for(const arr of coordMap.values())if(arr.some(z=>z.e===p[x])&&arr.some(z=>z.e!==p[x]))intersects++;if(!intersects)errors.push(`unconnected word ${p[x].word}`)}for(const [k,arr] of coordMap){if(arr.length>1){const chars=new Set(arr.map(z=>z.e.word[z.i]));const dirs=new Set(arr.map(z=>z.e.dir));if(chars.size!==1||dirs.size<2)errors.push(`invalid crossing ${k}`)}}return errors}
function buildCrossword(uid){const u=DATA.units.find(x=>x.id===uid)||DATA.units[0];let all=u.vocab.map(v=>({word:stripWord(v[0]),clue:v[1],orig:v[0]})).filter(x=>x.word.length>=3&&x.word.length<=15),seen=new Set();all=all.filter(x=>x.word&&!seen.has(x.word)&&(seen.add(x.word),true));const layout=crosswordLayout(all,21,8),placed=layout?.placed||[],grid=layout?.grid||new Map(),layoutErrors=layout?validateCrosswordLayout(layout):['layout failed'];window.__crosswordDebug={uid,placed:placed.map(x=>({...x})),errors:layoutErrors};const area=document.getElementById('cwArea');if(!area)return;if(placed.length<4||layoutErrors.length){area.innerHTML=`<div class="feedback warn"><b>Could not build a valid intersecting puzzle on this shuffle.</b> Please generate again.</div>`;return}let used=[];for(const p of placed)for(let i=0;i<p.word.length;i++)used.push((p.r+(p.dir==='D'?i:0))+'-'+(p.c+(p.dir==='A'?i:0)));used=[...new Set(used)];const prefillCount=Math.max(1,Math.min(Math.floor(used.length*.30),Math.round(used.length*(.15+Math.random()*.15)))),pref=new Set(shuffle(used).slice(0,prefillCount));let minR=99,maxR=0,minC=99,maxC=0;used.forEach(k=>{let [r,c]=k.split('-').map(Number);minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c)});const starts=new Map();placed.forEach(p=>{const k=p.r+'-'+p.c;starts.set(k,(starts.get(k)||[]).concat(p))});let num=0,numbers=new Map();[...starts.keys()].sort((a,b)=>{const A=a.split('-').map(Number),B=b.split('-').map(Number);return A[0]-B[0]||A[1]-B[1]}).forEach(k=>numbers.set(k,++num));placed.forEach(p=>p.num=numbers.get(p.r+'-'+p.c));let html='';for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){const k=r+'-'+c,g=grid.get(k);if(g){const pf=pref.has(k),n=numbers.get(k);html+=`<div class="cwbox">${n?`<span class="cw-num">${n}</span>`:''}<input class="cell ${pf?'prefill':''}" maxlength="1" data-r="${r}" data-c="${c}" data-a="${g.ch}" ${pf?`value="${g.ch}" readonly`:''} aria-label="Crossword row ${r-minR+1} column ${c-minC+1}"></div>`}else html+='<div class="block"></div>'}area.innerHTML=`<div class="small muted">${placed.length} intersecting words · ${Math.round(prefillCount/used.length*100)}% of letters prefilled</div><div class="cross-wrap"><div class="crossgrid" style="grid-template-columns:repeat(${maxC-minC+1},38px)">${html}</div></div><div class="two-col section"><div><h4>Across</h4>${placed.filter(p=>p.dir==='A').sort((a,b)=>a.num-b.num).map(p=>`<button class="clue" data-id="${p.id}">${p.num}. ${esc(p.clue)}</button>`).join('')}</div><div><h4>Down</h4>${placed.filter(p=>p.dir==='D').sort((a,b)=>a.num-b.num).map(p=>`<button class="clue" data-id="${p.id}">${p.num}. ${esc(p.clue)}</button>`).join('')}</div></div><div class="actions"><button class="btn primary" id="cwCheck">Check Puzzle</button><button class="btn" id="cwHint">Hint</button><button class="btn" id="cwReset">Reset</button><button class="btn danger" id="cwReveal">Reveal</button></div><div id="cwFb"></div>`;let active=placed[0];function wordCells(p){return Array.from({length:p.word.length},(_,i)=>area.querySelector(`.cell[data-r="${p.r+(p.dir==='D'?i:0)}"][data-c="${p.c+(p.dir==='A'?i:0)}"]`)).filter(Boolean)}function activateWord(p){active=p;area.querySelectorAll('.cell').forEach(x=>x.classList.remove('hl'));area.querySelectorAll('.clue').forEach(x=>x.classList.remove('active'));wordCells(p).forEach(x=>x.classList.add('hl'));area.querySelector(`.clue[data-id="${p.id}"]`)?.classList.add('active')}area.querySelectorAll('.clue').forEach(c=>{c.onclick=()=>{const p=placed.find(x=>x.id===c.dataset.id);if(p){activateWord(p);wordCells(p).find(x=>!x.readOnly)?.focus()}}});area.querySelectorAll('.cell').forEach(inp=>{inp.oninput=()=>{inp.value=inp.value.toUpperCase().replace(/[^A-ZÑ]/g,'');if(inp.value&&active){const cells=wordCells(active),ix=cells.indexOf(inp);cells.slice(ix+1).find(x=>!x.readOnly)?.focus()}};inp.addEventListener('focus',()=>{const r=+inp.dataset.r,c=+inp.dataset.c,cands=placed.filter(p=>wordCells(p).includes(inp));if(cands.length){const p=cands.find(x=>x===active)||cands[0];activateWord(p)}})});activateWord(active);area.querySelector('#cwCheck').onclick=()=>{const all=[...area.querySelectorAll('.cell')],right=all.filter(x=>x.value.toUpperCase()===x.dataset.a).length,sc=pct(right,all.length);area.querySelector('#cwFb').innerHTML=`<div class="feedback ${sc===100?'success':'warn'}">${sc}% of squares are correct.</div>`;if(sc===100)gameScore('Crossword · '+u.title,100)};area.querySelector('#cwHint').onclick=()=>{const blanks=[...area.querySelectorAll('.cell:not([readonly])')].filter(x=>x.value.toUpperCase()!==x.dataset.a);if(blanks.length){const x=shuffle(blanks)[0];x.value=x.dataset.a;x.classList.add('prefill')}};area.querySelector('#cwReset').onclick=()=>area.querySelectorAll('.cell:not([readonly])').forEach(x=>{x.value='';x.classList.remove('prefill')});area.querySelector('#cwReveal').onclick=()=>confirmModal('Reveal puzzle?','This will fill every remaining letter.',()=>area.querySelectorAll('.cell').forEach(x=>x.value=x.dataset.a))}

function renderAssess(){document.getElementById('assess').innerHTML=`<div class="card"><h3>30-Question Unit Quizzes</h3><p>Each attempt randomly selects 30 questions from a larger validated unit bank and randomizes answer order.</p><div class="actions">${DATA.units.map((u,i)=>`<button class="btn" onclick="startAssessment('${u.id}','Unit ${i+1} Quiz')">Unit ${i+1}</button>`).join('')}</div></div><div class="card section"><h3>Cumulative Assessments</h3><div class="actions"><button class="btn primary" onclick="startCumulative('Quarter Review',0,2)">Quarter Review</button><button class="btn primary" onclick="startCumulative('Mid-Course Review',0,4)">Mid-Course Review</button><button class="btn accent" onclick="startCumulative('Final Honors Spanish 1 Review',0,7)">Final Review</button></div></div><div id="assessmentArea" class="section"></div>`}
function startCumulative(label,a,b){let qs=[];for(let i=a;i<=b;i++)qs.push(...DATA.banks[DATA.units[i].id]);runAssessment(shuffle(qs).slice(0,30),label,'cumulative')}
function startAssessment(uid,label){runAssessment(shuffle(DATA.banks[uid]).slice(0,30),label,uid)}
function runAssessment(qs,label,kind){const area=document.getElementById('assessmentArea');let answers=Array(qs.length).fill(null),idx=0;function draw(){const q=qs[idx];let input='';if(q.type==='mc'){input=`<div class="choices">${shuffle(q.choices).map(c=>`<button class="choice ${answers[idx]===c?'selected':''}" data-val="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}else if(q.type==='fill'){input=`<input id="assIn" value="${esc(answers[idx]||'')}" style="min-height:48px;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px" aria-label="Answer">`}else{input=`<input id="assIn" value="${esc(answers[idx]||'')}" style="min-height:48px;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px" aria-label="Type ordered sentence">`}area.innerHTML=`<div class="assessment-header"><div class="card"><b>${esc(label)}</b> · Question ${idx+1}/30 ${iconProgress(Math.round((idx+1)/30*100))}</div></div><div class="card"><div class="small muted">${esc(q.topic)} · ${skillNames[q.cat]||q.cat}</div><h3>${esc(q.prompt)}</h3>${input}<div class="actions" style="margin-top:14px"><button class="btn" id="assPrev" ${idx===0?'disabled':''}>Previous</button><button class="btn primary" id="assNext">${idx===29?'Review & Submit':'Next'}</button></div></div>`;if(q.type==='mc')area.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{answers[idx]=b.dataset.val;draw()});area.querySelector('#assPrev').onclick=()=>{saveInput();idx--;draw()};area.querySelector('#assNext').onclick=()=>{saveInput();if(idx<29){idx++;draw()}else review()}}
function saveInput(){if(qs[idx].type!=='mc'){const x=area.querySelector('#assIn');if(x)answers[idx]=x.value}}
function review(){area.innerHTML=`<div class="card"><h3>Ready to submit?</h3><p>${answers.filter(x=>String(x||'').trim()).length} of 30 questions have an answer.</p><div class="actions"><button class="btn primary" id="submitAss">Submit Assessment</button><button class="btn" id="backAss">Return to Questions</button></div></div>`;area.querySelector('#backAss').onclick=()=>draw();area.querySelector('#submitAss').onclick=()=>score()}
function score(){let correct=0,by={vocabulary:[0,0],grammar:[0,0],verbs:[0,0],reading:[0,0],writing:[0,0]},miss=[];qs.forEach((q,i)=>{let r=q.type==='fill'?checkText(answers[i],[q.answer,...(q.alts||[])]).ok:norm(answers[i])===norm(q.answer);let cat=q.cat==='vocabulary'?'vocabulary':q.cat==='verbs'?'verbs':q.cat==='reading'?'reading':q.cat==='writing'?'writing':'grammar';by[cat][1]++;if(r){correct++;by[cat][0]++;resolveMistake(q)}else{miss.push({q,given:answers[i]});addMistake(q,answers[i])}addSkill(cat,r)});const percent=pct(correct,30),rec={date:new Date().toISOString(),label,percent,correct,total:30,kind,breakdown:Object.fromEntries(Object.entries(by).map(([k,v])=>[k,pct(v[0],v[1])])),missed:miss.length};state.quizHistory.push(rec);state.quizHistory=state.quizHistory.slice(-40);state.assessmentHistory.push(rec);state.assessmentHistory=state.assessmentHistory.slice(-60);recordActivity('assessment',label,percent);area.innerHTML=`<div class="card"><div class="two-col" style="align-items:center"><div><h3>${esc(label)} Results</h3><div class="score-ring" style="--pct:${percent}%"><b>${percent}%</b></div><p>${correct}/30 correct</p></div><div><h4>Topic Breakdown</h4>${Object.entries(by).filter(x=>x[1][1]).map(([k,v])=>`<div class="bar-row"><span>${skillNames[k]}</span>${iconProgress(pct(v[0],v[1]))}<b>${pct(v[0],v[1])}%</b></div>`).join('')}</div></div></div><div class="card section"><h3>Missed Questions & Explanations</h3>${miss.length?miss.map(m=>`<div class="qbox"><b>${esc(m.q.prompt)}</b><div>Your answer: ${esc(m.given||'(blank)')}</div><div>Correct: <b>${esc(m.q.answer)}</b></div><div class="muted">${esc(m.q.explanation)}</div></div>`).join(''):'<div class="success qbox">Perfect score — no missed questions.</div>'}<div class="actions"><button class="btn" onclick="navigate('mistakes')">Review My Mistakes</button><button class="btn primary" onclick="navigate('course')">Recommended Lessons</button></div></div>`}
draw()}

function renderMistakes(){const active=state.mistakes.filter(m=>!m.resolved),resolved=state.mistakes.filter(m=>m.resolved);document.getElementById('mistakes').innerHTML=`<div class="card"><h3>Review My Mistakes</h3><p>${active.length} active missed concept${active.length===1?'':'s'}. A mistake is marked resolved after repeated later success.</p><div class="actions"><button class="btn primary" onclick="weakSpotPractice()" ${active.length?'':'disabled'}>Weak Spot Practice</button></div></div><div class="card section"><h3>Active Mistakes</h3>${active.length?active.slice(0,30).map(m=>`<div class="qbox"><div class="small muted">${esc(m.topic)} · ${new Date(m.date).toLocaleDateString()}</div><b>${esc(m.prompt)}</b><div>Correct answer: <b>${esc(m.answer)}</b></div><div class="muted small">Later correct: ${m.correctLater||0}/2 needed to resolve</div></div>`).join(''):'<div class="success qbox">No active mistakes. Keep practicing.</div>'}</div><div class="card section"><h3>Resolved</h3>${resolved.length?resolved.slice(0,15).map(m=>`<div>${esc(m.topic)} — ${esc(m.prompt)}</div>`).join(''):'<div class="muted">None yet.</div>'}</div><div id="weakArea"></div>`}
function weakSpotPractice(){const active=state.mistakes.filter(m=>!m.resolved);let qs=[];for(const m of active){for(const bank of Object.values(DATA.banks)){const q=bank.find(q=>norm(q.prompt)===norm(m.prompt)&&norm(q.answer)===norm(m.answer));if(q){qs.push(q);break}}}if(qs.length<5){const weakCats=Object.entries(state.mastery.skills).sort((a,b)=>pct(a[1].correct,a[1].attempts)-pct(b[1].correct,b[1].attempts)).map(x=>x[0]);for(const u of DATA.units)qs.push(...DATA.banks[u.id].filter(q=>(q.cat===weakCats[0]||(weakCats[0]==='grammar'&&q.cat==='grammar'))));}qs=shuffle(qs).slice(0,10);const a=document.getElementById('weakArea');a.innerHTML='<div class="card section"><h3>Weak Spot Practice</h3><div id="weakQs"></div></div>';renderQuestionSet(a.querySelector('#weakQs'),qs,{label:'Weak Spot',onComplete:r=>recordActivity('practice','Weak Spot Practice',r.percent)})}

function renderReading(){document.getElementById('reading').innerHTML=DATA.units.map((u,i)=>`<div class="card" style="margin-bottom:14px"><div class="small muted">LEVEL ${Math.min(4,Math.ceil((i+1)/2))} · Unit ${i+1}</div><h3>${esc(u.reading.title)}</h3><p style="white-space:pre-line">${esc(u.reading.text)}</p><button class="btn primary" onclick="readingCheck('${u.id}')">Comprehension Check</button><div id="read-${u.id}"></div></div>`).join('')}
function readingCheck(uid){const u=DATA.units.find(x=>x.id===uid);const qs=u.reading.qs.map(([p,a])=>({type:'fill',prompt:p,answer:a,alts:[],topic:'reading',cat:'reading',explanation:`The passage states or supports: ${a}.`,unit:uid}));const el=document.getElementById('read-'+uid);renderQuestionSet(el,qs,{label:'Reading Check',onComplete:r=>recordActivity('reading','Reading · '+u.reading.title,r.percent)})}
function renderWriting(){document.getElementById('writing').innerHTML=`<div class="card"><h3>Writing Lab</h3><p>Stages progress from controlled sentence work to original paragraphs. Automatically graded tasks are labeled. Open-ended responses use rule-based checks and self-comparison; the app does <b>not</b> claim full grammatical evaluation.</p></div>`+DATA.units.map((u,i)=>`<div class="card section"><div class="small muted">UNIT ${i+1} · ${i<2?'Stage 1–2':i<5?'Stage 3–4':'Stage 4–5'}</div><h3>${esc(u.title)}</h3><p>${esc(u.writing)}</p><textarea id="write-${u.id}" rows="6" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px" placeholder="Write your response here…"></textarea><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="checkWriting('${u.id}')">Self-Check</button><button class="btn" onclick="saveWriting('${u.id}')">Save Practice</button></div><div id="writefb-${u.id}"></div></div>`).join('')}
function checkWriting(uid){const u=DATA.units.find(x=>x.id===uid),txt=document.getElementById('write-'+uid).value.trim(),words=txt.split(/\s+/).filter(Boolean).length,sents=(txt.match(/[.!?]/g)||[]).length;let checks=[['Attempt entered',txt.length>10],['Multiple words',words>=8],['Sentence punctuation used',sents>=1]];if(uid==='u4')checks.push(['Contains a near-future pattern',/\b(voy|vas|va|vamos|van)\s+a\s+\w+/i.test(txt)]);if(uid==='u5')checks.push(['Contains present progressive',/\b(estoy|estás|está|estamos|están)\s+\w+(ando|iendo)\b/i.test(noAccent(txt))]);if(uid==='u7')checks.push(['Uses a demonstrative',/\b(este|esta|estos|estas|ese|esa|esos|esas|aquel|aquella|aquellos|aquellas)\b/i.test(noAccent(txt))]);if(uid==='u8')checks.push(['Uses near future',/\b(voy|vas|va|vamos|van)\s+a\s+\w+/i.test(txt)]);const score=pct(checks.filter(x=>x[1]).length,checks.length);document.getElementById('writefb-'+uid).innerHTML=`<div class="feedback"><b>Rule-based self-check: ${score}% of structural checks met.</b><ul>${checks.map(x=>`<li>${x[1]?'✓':'○'} ${x[0]}</li>`).join('')}</ul><p class="muted small">This is not a full grammar grade. Compare your response with the lesson rules and examples, then revise.</p></div>`;addSkill('writing',score>=75);recordActivity('writing','Writing Lab · '+u.title,score)}
function saveWriting(uid){const t=document.getElementById('write-'+uid).value;state.lessons['writing-'+uid]={text:t,date:new Date().toISOString()};recordActivity('writing','Saved Writing · '+uid)}

function renderReference(){const verbCards=DATA.units.flatMap(u=>u.verbs).filter((v,i,a)=>a.findIndex(x=>x.inf===v.inf)===i);document.getElementById('reference').innerHTML=`<div class="grid g2"><div class="card"><h3>Subject Pronouns</h3><table class="verb-table">${pronouns.map((p,i)=>`<tr><td>${p}</td><td>${['I','you informal','he/she/you formal','we','you all (Spain)','they/you all'][i]}</td></tr>`).join('')}</table></div><div class="card"><h3>Articles</h3><p><b>Definite:</b> el, la, los, las</p><p><b>Indefinite:</b> un, una, unos, unas</p><p>Match noun gender and number.</p></div><div class="card"><h3>Regular Present Endings</h3><p><b>-AR:</b> o, as, a, amos, áis, an</p><p><b>-ER:</b> o, es, e, emos, éis, en</p><p><b>-IR:</b> o, es, e, imos, ís, en</p></div><div class="card"><h3>Question Words</h3><p>¿qué? · ¿quién? · ¿dónde? · ¿cuándo? · ¿por qué? · ¿cómo? · ¿cuánto?</p></div><div class="card"><h3>Ordinal Numbers</h3><p>primero/a · segundo/a · tercero/a · cuarto/a · quinto/a</p><p class="small muted">Introductory ordinal forms included to match the instructor course coverage.</p></div><div class="card"><h3>Demonstratives</h3><p><b>this/these:</b> este, esta, estos, estas</p><p><b>that/those:</b> ese, esa, esos, esas</p><p><b>over there:</b> aquel, aquella, aquellos, aquellas</p></div><div class="card"><h3>Direct Objects</h3><p>me · te · lo/la · nos · os · los/las</p><p>Place before a conjugated verb in the structures taught here.</p></div></div><div class="card section"><h3>Common Course Verbs</h3><div class="grid g2">${verbCards.map(v=>`<div class="qbox"><b>${esc(v.inf)}</b> — ${esc(v.en)}<div class="small">${v.forms.join(' · ')}</div></div>`).join('')}</div></div>`}
function rankSkills(strong){let a=Object.keys(skillNames).map(k=>[skillNames[k],skillPct(k),state.mastery.skills[k]?.attempts||0]).filter(x=>x[2]>0);a.sort((x,y)=>strong?y[1]-x[1]:x[1]-y[1]);return a.length?a.slice(0,3).map(x=>`<div class="lesson-row"><span>${esc(x[0])}</span><b>${x[1]}%</b></div>`).join(''):'<div class="muted">Complete practice to build this ranking.</div>'}
function renderProgress(){const unitRows=DATA.units.map((u,i)=>{const done=u.lessons.filter((l,j)=>state.lessons[u.id+'-'+j]?.completed).length,p=pct(done,u.lessons.length);return `<div class="bar-row"><span>Unit ${i+1}</span>${iconProgress(p)}<b>${p}%</b></div>`}).join('');const gameRows=Object.entries(state.games).sort((a,b)=>b[1].best-a[1].best).slice(0,10);document.getElementById('progress').innerHTML=`<div class="grid g3"><div class="card"><h3>Overall</h3><div class="metric">${overallProgress()}%</div>${iconProgress(overallProgress())}</div><div class="card"><h3>Study Streak</h3><div class="metric">${streak()}</div><div>days</div></div><div class="card"><h3>Total Activities</h3><div class="metric">${state.totalActivities}</div></div></div><div class="grid g2 section"><div class="card"><h3>Unit Progress</h3><div class="bar-chart">${unitRows}</div></div><div class="card"><h3>Skill Mastery</h3>${Object.keys(skillNames).map(k=>`<div class="bar-row"><span>${skillNames[k]}</span>${iconProgress(skillPct(k))}<b>${skillPct(k)}%</b></div>`).join('')}</div></div><div class="grid g2 section"><div class="card"><h3>Quiz History</h3>${state.quizHistory.length?state.quizHistory.slice().reverse().slice(0,12).map(q=>`<div class="lesson-row"><span>${esc(q.label)}<br><span class="muted small">${new Date(q.date).toLocaleDateString()}</span></span><b>${q.percent}%</b></div>`).join(''):'<div class="muted">No quiz attempts yet.</div>'}</div><div class="card"><h3>Game Best Scores</h3>${gameRows.length?gameRows.map(([k,v])=>`<div class="lesson-row"><span>${esc(k)}</span><b>${v.best}%</b></div>`).join(''):'<div class="muted">No game scores yet.</div>'}</div></div><div class="grid g3 section"><div class="card"><h3>Weakest Skills</h3>${rankSkills(false)}</div><div class="card"><h3>Strongest Skills</h3>${rankSkills(true)}</div><div class="card"><h3>Recent Activity</h3>${state.activity.length?state.activity.slice(-7).reverse().map(a=>`<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(a.text)}<br><span class="muted">${new Date(a.date).toLocaleDateString()}</span></div>`).join(''):'<div class="muted">No activity yet.</div>'}</div></div>`}
function renderAlignment(){document.getElementById('alignment').innerHTML=`<div class="card"><h3>Source & Curriculum Alignment</h3><p>The instructor’s course-content document defines the Honors Spanish 1 scope. <i>Libro Libre: Beginning Spanish</i> provides the primary instructional sequence and source language. Later textbook chapters are not automatically treated as Spanish 1 scope.</p></div>`+DATA.units.map((u,i)=>`<div class="card section"><div class="small muted">UNIT ${i+1}</div><h3>${esc(u.title)}</h3><p><b>Source:</b> ${esc(u.source)}</p><p><b>Main vocabulary:</b> ${u.vocab.slice(0,14).map(v=>esc(v[0])).join(', ')}${u.vocab.length>14?', …':''}</p><p><b>Grammar:</b> ${u.grammar.map(esc).join(' ')}</p><p><b>Primary verbs:</b> ${u.verbs.map(v=>esc(v.inf)).join(', ')||'Foundational formulaic language only'}</p><p><b>Reading:</b> ${esc(u.reading.title)}</p><p><b>Writing:</b> ${esc(u.writing)}</p><p><b>Culture focus from course plan:</b> ${esc(u.culture)}</p></div>`).join('')}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card"><h3>Local Progress Data</h3><p>Progress is stored only in this browser/device using localStorage.</p><div class="actions"><button class="btn primary" onclick="exportProgress()">Export Progress JSON</button><label class="btn" style="display:inline-flex;align-items:center">Import Progress JSON<input type="file" accept="application/json,.json" class="sr-only" onchange="importProgress(this.files[0])"></label><button class="btn danger" onclick="resetProgress()">Reset Progress</button></div></div><div class="card section"><h3>Storage Summary</h3><p>Lessons completed: ${completedCount()}</p><p>Quiz attempts: ${state.quizHistory.length}</p><p>Stored mistakes: ${state.mistakes.length}</p><p>Study dates: ${state.studyDates.length}</p></div>`}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Honors_Spanish_1_Progress_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);recordActivity('data','Exported Progress Backup')}
function importProgress(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object'||!x.version)throw new Error('Invalid backup');confirmModal('Import progress?','This will replace the current local progress on this device.',()=>{state=Object.assign(freshState(),x);saveState();navigate('dashboard')})}catch(e){alert('Could not import this file. It does not appear to be a valid progress backup.')}};r.readAsText(file)}
function resetProgress(){confirmModal('Reset all progress?','This permanently clears lessons, mastery, scores, mistakes, and study history from this device. Export a backup first if you may want it later.',()=>{localStorage.removeItem(STORE_KEY);state=freshState();saveState();navigate('dashboard')})}
function confirmModal(title,body,ok){const m=document.getElementById('modal');document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').textContent=body;m.classList.add('open');const yes=document.getElementById('modalOk'),no=document.getElementById('modalCancel');yes.onclick=()=>{m.classList.remove('open');ok?.()};no.onclick=()=>m.classList.remove('open');no.focus()}
function renderAbout(){const v=window.__validation||runPreflight();document.getElementById('about').innerHTML=`<div class="card"><h3>${APP_VERSION}</h3><p>This release was built as a single offline HTML application. The supplied instructor course-content document and <i>Libro Libre: Beginning Spanish</i> were reviewed and mapped before the build.</p><div class="grid g2"><div class="qbox"><b>Source materials reviewed</b><br>Instructor course coverage + Libro Libre sequence/selected vocabulary and grammar sections.</div><div class="qbox"><b>Curriculum mapped</b><br>8 units · ${allLessons().length} lessons · present-tense Spanish 1 boundary.</div><div class="qbox"><b>Academic + question-bank validation</b><br>Source-alignment audit completed; ${v.questions} embedded questions, ${v.vocab} vocabulary entries, ${v.verbs} verb paradigms, and game data preflighted · ${v.errors.length} structural errors.</div><div class="qbox"><b>Technical validation</b><br>Navigation, persistence hooks, import/export/reset code paths, quiz scoring, every game launch/interaction, the strict-intersection crossword generator, and responsive/mobile navigation were exercised in browser testing.</div></div><p class="small muted">Validation claims refer to checks actually performed for this generated release. Open-ended paragraph practice uses rule-based self-checks and is not represented as full grammatical grading.</p></div>`}

function runPreflight(){let errors=[],questions=0,dups=new Set(),vocab=0,verbs=0;for(const u of DATA.units){const bank=DATA.banks[u.id];if(!Array.isArray(bank)||bank.length<30)errors.push(`${u.id}: bank has fewer than 30 questions`);const vu=new Set();for(const v of u.vocab){vocab++;if(!Array.isArray(v)||!v[0]||!v[1]||!v[3])errors.push(`${u.id}: malformed vocabulary entry`);const k=norm(v[0]);if(vu.has(k))errors.push(`${u.id}: duplicate vocabulary ${v[0]}`);vu.add(k)}for(const v of u.verbs||[]){verbs++;if(!v.inf||!v.en||!Array.isArray(v.forms)||v.forms.length!==6||v.forms.some(x=>!x))errors.push(`${u.id}: malformed verb ${v.inf||'(blank)'}`)}for(const q of bank||[]){questions++;if(!q.prompt||!q.answer||!q.explanation)errors.push(`${u.id}: malformed question`);const k=norm(q.prompt)+'|'+norm(q.answer);if(dups.has(u.id+'|'+k))errors.push(`${u.id}: duplicate ${q.prompt}`);dups.add(u.id+'|'+k);if(q.type==='mc'){if(!Array.isArray(q.choices)||q.choices.length<4)errors.push(`${u.id}: MC choices missing`);if(new Set(q.choices.map(norm)).size!==q.choices.length)errors.push(`${u.id}: duplicate choices ${q.prompt}`);if(!q.choices.some(c=>norm(c)===norm(q.answer)))errors.push(`${u.id}: answer not in choices ${q.prompt}`)}}for(const l of u.lessons){if(!l[0]||!l[1]||!Array.isArray(l[5])||l[5].length<5)errors.push(`${u.id}: lesson check malformed`)}}for(const x of DATA.sentenceBank||[]){if(!Array.isArray(x)||x.length<2||x.some(w=>!String(w).trim()))errors.push('Sentence Builder: malformed sentence')}for(const x of DATA.translations||[]){if(!Array.isArray(x)||x.length!==3||!x[0]||!Array.isArray(x[1])||!x[1].length||!x[2])errors.push('Translation Challenge: malformed item');else if(!x[1].some(a=>norm(a)===norm(x[2])))errors.push(`Translation Challenge: model not accepted — ${x[0]}`)}const sortItems=[['el libro','Masculine'],['la camisa','Feminine'],['el vuelo','Masculine'],['la playa','Feminine'],['los zapatos','Masculine'],['las matemáticas','Feminine'],['el arte','Masculine'],['la mochila','Feminine']];if(sortItems.some(x=>!x[0]||!['Masculine','Feminine'].includes(x[1])))errors.push('Grammar Sort: malformed item');const result={version:APP_VERSION,questions,vocab,verbs,units:DATA.units.length,lessons:allLessons().length,gameSets:{sentences:DATA.sentenceBank.length,translations:DATA.translations.length,grammarSort:sortItems.length},errors,passed:errors.length===0,timestamp:new Date().toISOString()};window.__validation=result;document.getElementById('debug').textContent=JSON.stringify(result,null,2);return result}

setupNav();runPreflight();renderDashboard();show('dashboard','Dashboard');
</script>
<!--
VALIDATION / DEVELOPER PREFLIGHT — V3 GAME + CROSSWORD CORRECTION AUDIT
- V3 retains the V2 source-by-source academic audit and adds a full game-function audit.
- Game data and behavior rechecked: vocabulary matching, verb challenges, sentence builder (including duplicate-word drag IDs), grammar sort, controlled translations, and crossword construction.
- Runtime preflight checks question banks plus vocabulary entries, 6-form verb paradigms, sentence-builder sets, translation acceptance/model consistency, and grammar-sort data.
- Crossword V3 requires every added entry to intersect an existing entry at the same letter; illegal side-touching, same-direction overlaps, disconnected fallback words, and mismatched crossings are rejected.
- Open writing is explicitly rule-based/self-comparison, never represented as full AI grading.
- Spanish answer normalization ignores capitalization, outer/duplicate spaces, and final punctuation. Accent-only differences are accepted with a reminder, not silently normalized as fully equivalent spelling.
- Curriculum boundary intentionally excludes imperfect, preterite, present perfect, subjunctive, future, and conditional despite their presence later in Libro Libre, because they are not in the supplied Honors Spanish 1 grammar list.
-->
</body>
</html>
